[project]
name = "bess-telemetry"
version = "0.1.0"
description = "Battery storage simulator (Modbus TCP) and edge agent streaming telemetry to AWS IoT Core over MQTT/TLS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pymodbus==3.16.1",
    "paho-mqtt==2.1.0",
]

[project.scripts]
bess-sim = "bess_telemetry.simulator:main"
bess-agent = "bess_telemetry.agent:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bess_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S104"]  # the simulator binds 0.0.0.0 on purpose (inside a container)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
