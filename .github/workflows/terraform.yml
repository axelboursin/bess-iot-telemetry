name: Terraform

on:
  pull_request:
    paths: ["terraform/**", "devices/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "devices/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS STS, no long-lived keys

concurrency:
  group: terraform-dev # never run two plans/applies against the same state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_repository: ${{ github.repository }}

jobs:
  plan:
    name: Plan (read-only role)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - name: Init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=bess-iot-telemetry/dev.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Plan
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan
      - name: Publish plan to the job summary
        run: |
          {
            echo '### Terraform plan (dev)'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (protected environment)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers are configured on this environment in GitHub, and the
    # apply role's trust policy only accepts tokens issued for it.
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - name: Init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=bess-iot-telemetry/dev.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Plan
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan
      - name: Apply
        run: terraform apply tfplan
      - name: Smoke test
        run: |
          table=$(terraform output -raw athena_table)
          workgroup=$(terraform output -raw athena_workgroup)
          aws athena start-query-execution --work-group "$workgroup" \
            --query-string "SELECT count(*) FROM $table WHERE year = '$(date -u +%Y)'" \
            --query 'QueryExecutionId' --output text
